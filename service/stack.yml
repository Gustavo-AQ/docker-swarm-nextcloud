version: "3.8"

services:

  nextcloud:
    image: nextcloud:apache

    ports:
      - "8080:80"

    environment:
      REDIS_HOST: redis

      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}

      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}

    volumes:
      - nextcloud_data:/var/www/html

    networks:
      - frontend
      - backend

    deploy:
      replicas: 1

      restart_policy:
        condition: on-failure

      update_config:
        parallelism: 1
        delay: 10s


  redis:
    image: redis:alpine

    networks:
      - backend

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping

      interval: 10s
      timeout: 5s
      retries: 5

    deploy:
      replicas: 1

      restart_policy:
        condition: on-failure


  db:
    image: mariadb:10.11

    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - backend

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized

      interval: 10s
      timeout: 5s
      retries: 5

    deploy:
      replicas: 1

      restart_policy:
        condition: on-failure


networks:

  frontend:
    driver: overlay

  backend:
    driver: overlay


volumes:

  nextcloud_data:
    driver: local

    driver_opts:
      type: nfs
      o: addr=10.10.10.100,rw,nfsvers=3
      device: ":/srv/nfs/nextcloud"


  mariadb_data:
    driver: local

    driver_opts:
      type: nfs
      o: addr=10.10.10.100,rw,nfsvers=3
      device: ":/srv/nfs/mariadb"